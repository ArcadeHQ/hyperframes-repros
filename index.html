<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=360" />
    <title>Media src written in a querySelectorAll loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 640px;
        height: 360px;
        overflow: hidden;
        background: #000;
      }
      video {
        position: absolute;
        inset: 0;
        width: 640px;
        height: 360px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="640"
      data-height="360"
    >
      <video
        id="clip"
        class="clip"
        data-clip
        data-start="0"
        data-duration="3"
        data-track-index="1"
        src="assets/red-authored.mp4"
        muted
        playsinline
      ></video>
    </div>

    <script>
      // The write the render does not follow. Swap it for the line below and the render follows it:
      //   document.querySelector("#clip").src = "assets/blue-swapped.mp4";
      document.querySelectorAll("[data-clip]").forEach((el) => {
        el.src = "assets/blue-swapped.mp4";
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
