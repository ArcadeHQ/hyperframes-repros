<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #swatch {
        position: absolute;
        inset: 0;
        background: #111;
        transition: background-color 0.5s linear;
      }
      #swatch.on {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <!--
      GSAP restores a class on seek. CSS transition is wall-clock, so a
      jump seek (chunk worker, or snapshot --at mid-timeline) replays the
      fade. Sequential capture does not: the swap already happened.

      Pin: hyperframes@0.8.3 (package.json).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="swatch"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#swatch", { attr: { class: "on" } }, 0.2);
      tl.to({}, { duration: 4 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
