<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111;
      }
      [data-composition-src] {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <!--
      Repro shaped like Arcade wizard comps:
      - nested scenes with stamped host data-duration
      - one long take sliced via data-media-start
      - bare in-scene <video> (no data-start, no data-duration)

      Compile injects data-hf-auto-start → browser probe runs (visibility).
      ffprobe fills natural remaining length in the DOM; parseSubCompositions
      clamps composition.videos to each 3s slot; unpatched probeStage extends
      end back to the natural window.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-a-host"
        data-composition-id="scene-a"
        data-composition-src="compositions/scene-a.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-no-timeline
      ></div>
      <div
        id="scene-b-host"
        data-composition-id="scene-b"
        data-composition-src="compositions/scene-b.html"
        data-start="3"
        data-duration="3"
        data-track-index="0"
        data-no-timeline
      ></div>
      <div
        id="scene-c-host"
        data-composition-id="scene-c"
        data-composition-src="compositions/scene-c.html"
        data-start="6"
        data-duration="3"
        data-track-index="0"
        data-no-timeline
      ></div>
      <div
        id="scene-d-host"
        data-composition-id="scene-d"
        data-composition-src="compositions/scene-d.html"
        data-start="9"
        data-duration="3"
        data-track-index="0"
        data-no-timeline
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
