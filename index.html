<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font: 96px sans-serif;
        color: #fff;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      #count { background: #223; }
      #s2 { background: #232; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9"
      data-width="1920"
      data-height="1080"
    >
      <audio id="bed" src="assets/tone.wav" data-start="0" data-duration="9" data-track-index="0"></audio>
      <div id="count" class="scene clip" data-start="0" data-duration="3" data-track-index="1">0</div>
      <div id="s2" class="scene clip" data-start="3" data-duration="3" data-track-index="1">scene 2</div>
      <div
        id="scene3"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="6"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1: a count-up tweened through an object with a setter.
      // Any setter target makes the preview probe the <audio> volume by
      // seeking the whole timeline through the audio's window.
      const counter = {
        value: 0,
        get v() { return this.value; },
        set v(next) {
          this.value = next;
          document.getElementById("count").textContent = Math.round(next);
        },
      };
      tl.to(counter, { v: 100, duration: 2, ease: "none" }, 0);

      tl.to({}, { duration: 9 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
