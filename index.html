<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111;
      }
      [data-composition-src] {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <!--
      Two nested scenes, each with <video id="clip"> — legal per file.
      Once inlined into one render document, extract/inject key on raw id and
      collide → scene chrome paints, footage does not.

      Pin: hyperframes@0.8.3 (package.json).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-a-host"
        data-composition-id="scene-a"
        data-composition-src="compositions/scene-a.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-no-timeline
      ></div>
      <div
        id="scene-b-host"
        data-composition-id="scene-b"
        data-composition-src="compositions/scene-b.html"
        data-start="3"
        data-duration="3"
        data-track-index="0"
        data-no-timeline
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true }).to({}, { duration: 6 });
    </script>
  </body>
</html>
