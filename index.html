<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111;
      }
      #clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
      #label {
        position: absolute;
        left: 80px;
        top: 80px;
        width: 320px;
        height: 24px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <!--
        assets/ten-colors-10s.mp4 shows one solid colour per source second:
        0 red, 1 orange, 2 yellow, 3 green, 4 cyan, 5 blue, 6 purple,
        7 magenta, 8 white, 9 grey.

        The clip plays at 1.5x, so composition time t shows source second
        floor(1.5 * t): t=1.5 -> 2.25 s (yellow), t=3.5 -> 5.25 s (blue).
      -->
      <video
        id="clip"
        class="clip"
        src="assets/ten-colors-10s.mp4"
        data-start="0"
        data-duration="4"
        data-playback-rate="1.5"
        muted
        playsinline
      ></video>
      <!-- Moves for the whole 4 s so check's layout sweep sees the timeline advance. -->
      <div id="label" class="clip" data-start="0" data-duration="4"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#label", { x: 400, duration: 4, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
