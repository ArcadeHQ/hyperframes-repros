<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Runtime-assigned video src + duplicate ids across scenes</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; overflow: hidden; background: #202020; }
    [data-composition-id="main"] {
      width: 1280px; height: 720px; position: relative;
    }
    [data-composition-id="main"] > [data-composition-id] {
      position: absolute; inset: 0;
    }
  </style>
</head>
<body>
  <div data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="8" data-captions="false">
    <div id="scene-a" data-composition-id="scene-a" data-composition-src="compositions/scene-a.html" data-start="0" data-duration="4" data-track-index="1"></div>
    <div id="scene-b" data-composition-id="scene-b" data-composition-src="compositions/scene-b.html" data-start="scene-a" data-duration="4" data-track-index="1"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines['main'] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
