<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      .gradient {
        font-size: 120px;
        background: linear-gradient(red, blue);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="main" data-no-timeline data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <div class="clip" data-start="0" data-duration="1">
        <div class="gradient">Direct text</div>
        <!-- Any transform, opacity or filter on the child (what a GSAP tween leaves behind) is enough. -->
        <div class="gradient"><div style="transform: translateY(0)">Transformed child</div></div>
      </div>
    </div>
  </body>
</html>
