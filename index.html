<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111;
      }
      [data-composition-src] {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <!--
      Repro: four short scene slots reuse one 90s take at deep media-starts.
      probeStage must keep each video's compile-time end (scene window).
      Unpatched main extends end toward full source duration → huge extracts;
      deep scenes can time out black on constrained runners.

      force-probe has no data-duration so the browser probe runs (otherwise
      known-duration static media skips the reconcile path that has the bug).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-a-host"
        data-composition-id="scene-a"
        data-composition-src="compositions/scene-a.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
      ></div>
      <div
        id="scene-b-host"
        data-composition-id="scene-b"
        data-composition-src="compositions/scene-b.html"
        data-start="3"
        data-duration="3"
        data-track-index="0"
      ></div>
      <div
        id="scene-c-host"
        data-composition-id="scene-c"
        data-composition-src="compositions/scene-c.html"
        data-start="6"
        data-duration="3"
        data-track-index="0"
      ></div>
      <div
        id="scene-d-host"
        data-composition-id="scene-d"
        data-composition-src="compositions/scene-d.html"
        data-start="9"
        data-duration="3"
        data-track-index="0"
      ></div>
      <div
        id="force-probe-host"
        data-composition-id="force-probe"
        data-composition-src="compositions/force-probe.html"
        data-start="0"
        data-track-index="9"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
