<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        overflow: hidden;
      }
      #scene-ok {
        left: 0;
      }
      #scene-bad {
        left: 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-ok"
        class="clip"
        data-composition-id="scene-ok"
        data-composition-src="compositions/scene-ok.html"
        data-start="0"
        data-duration="2"
        data-track-index="0"
      ></div>
      <div
        id="scene-bad"
        class="clip"
        data-composition-id="scene-bad"
        data-composition-src="compositions/scene-bad.html"
        data-start="0"
        data-duration="2"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 2 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
