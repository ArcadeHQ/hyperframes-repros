<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      
      

      <div
        id="title"
        style="
          font-size: 96px;
          color: #fff;
          padding: 80px;
          opacity: 0;
        "
      >
        Hello World
      </div>

      <!-- Word-timing cues the author transcribed by hand; the closing quote
           after "timeSeconds" was dropped, so the JSON is malformed. -->
      <div
        id="cues"
        data-cues='[{"word":"Hello","timeSeconds:0.4}]'
        style="display: none"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // Throws: the attribute JSON is malformed, and the parse is unguarded.
      const cues = JSON.parse(
        document.querySelector("#cues").getAttribute("data-cues")
      );

      // Never reached — the timeline stays empty, #title stays at opacity 0.
      tl.fromTo(
        "#title",
        { opacity: 0 },
        { opacity: 1, duration: 1 },
        cues[0].timeSeconds
      );
    </script>
  </body>
</html>
