<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .slot { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="hook" class="slot" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2" data-track-index="0"></div>
      <div id="performance" class="slot" data-composition-id="performance" data-composition-src="compositions/performance.html" data-start="2" data-duration="2" data-track-index="0"></div>
      <div id="community" class="slot" data-composition-id="community" data-composition-src="compositions/community.html" data-start="4" data-duration="2" data-track-index="0"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true }).to({}, { duration: 6 }, 0);
    </script>
  </body>
</html>
