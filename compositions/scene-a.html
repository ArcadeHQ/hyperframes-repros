<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .label {
        position: absolute;
        top: 48px;
        left: 48px;
        z-index: 2;
        padding: 12px 20px;
        font: 700 36px/1.2 system-ui, sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.65);
      }
    </style>
  </head>
  <body>
    <div
      id="scene-a"
      data-composition-id="scene-a"
      data-width="1920"
      data-height="1080"
      data-duration="3"
      data-no-timeline
    >
      <!--
        No data-duration on <video>: ffprobe fills natural remaining source
        length into the DOM. parseSubCompositions clamps composition.videos
        to the 3s scene slot; unpatched probeStage then extends end back to
        the natural window.
      -->
      <video
        id="cut-a"
        class="clip"
        src="assets/long-take.mp4"
        data-start="0"
        data-media-start="5"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <div class="label">scene-a · media-start 5s</div>
    </div>
  </body>
</html>
